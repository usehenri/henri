version: 2
updates:
  # One grouped PR a week for the whole pnpm workspace. Majors come separately
  # because they usually need a changeset and a look at the changelog.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Same one-day window as minimumReleaseAge in pnpm-workspace.yaml
    cooldown:
      default-days: 1
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # string-width is ESM only from 5. Core is CommonJS and requires it in
      # the logger, so a major would break the boot. Revisit with an ESM core.
      - dependency-name: string-width
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'
