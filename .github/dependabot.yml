version: 2
updates:
  # One grouped PR a week for the whole pnpm workspace. Majors come separately
  # because they usually need a changeset and a look at the changelog.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Same one-day window as minimumReleaseAge in pnpm-workspace.yaml
    cooldown:
      default-days: 1
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # ESM only from their next major, and core and the CLI are CommonJS, so
      # `require()` of either would throw ERR_REQUIRE_ESM at boot: string-width
      # from 5, chalk from 5. Their exports maps have no `require` condition at
      # all, which is what distinguishes them from a package that merely sets
      # `"type": "module"` and still ships a CommonJS build. Both come off with
      # an ESM core, together.
      - dependency-name: string-width
        update-types:
          - version-update:semver-major
      - dependency-name: chalk
        update-types:
          - version-update:semver-major
      # @apollo/server 5 declares `graphql: ^16.11.0` as its peer, up to and
      # including 5.4, so graphql 17 has nowhere to go in @usehenri/graphql.
      # Drop this when Apollo widens the range.
      - dependency-name: graphql
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'
