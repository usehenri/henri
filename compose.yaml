# Databases for local development, mirroring the service containers the
# `Live PostgreSQL` and `Live MySQL` jobs of .github/workflows/ci.yml use, so
# that a local run and CI exercise the same servers and versions.
#
#   pnpm db:up             start them and wait until they answer
#   pnpm test:sql:live     the SQL suites against postgres, then mysql, then mariadb
#   pnpm test:sql:postgres one of the three on its own
#   pnpm test:sql:mariadb  the same suites against the MariaDB below
#   pnpm test:sql:mssql    the sequelize, jobs and webhooks suites on SQL Server
#   pnpm test:redis        the shared store suite against the redis below
#   pnpm db:down           stop them, keeping the data
#   pnpm db:reset          stop them and delete the data
#
# All four servers have a CI job of their own (`Live PostgreSQL`,
# `Live MySQL`, `Live MariaDB`, `Live SQL Server`), each
# `continue-on-error`, so none of them blocks a pull request. These are the
# same servers, on ports that do not fight with whatever else is running.
#
# Nothing else in the repository needs Docker: `pnpm test` runs on sqlite and
# an in-process MongoDB, offline. The host ports can be moved when something
# else already listens on them:
#
#   HENRI_POSTGRES_PORT=55432 HENRI_MYSQL_PORT=53306 HENRI_MSSQL_PORT=51433 \
#     HENRI_MARIADB_PORT=13306 pnpm db:up

name: henri

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: henri
      POSTGRES_PASSWORD: henri
      POSTGRES_DB: henri_test
    ports:
      - '${HENRI_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U henri -d henri_test']
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: henri
      MYSQL_DATABASE: henri_test
    ports:
      - '${HENRI_MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -phenri']
      interval: 5s
      timeout: 5s
      retries: 20

  # MariaDB, which `"adapter": "mariadb"` (and a `mariadb://` url on the mysql
  # adapter) points at. It speaks the MySQL wire protocol and mysql2 connects
  # to it, but it is not MySQL: `JSON` is a `LONGTEXT` with a check
  # constraint, `SKIP LOCKED` only arrived in 10.6, and drizzle-kit reads its
  # catalogue through the MySQL introspection. So it gets a target of its own
  # (`HENRI_TEST_MARIADB_URL`) rather than being pointed at through
  # `HENRI_TEST_MYSQL_URL`.
  #
  # The port default is 3307 and not 3306: MariaDB's own default is 3306 and
  # the mysql service above already claims it, so `pnpm db:up` would refuse to
  # bind both.
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: henri
      MARIADB_DATABASE: henri_test
    ports:
      - '${HENRI_MARIADB_PORT:-3307}:3306'
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mariadb-admin ping -h 127.0.0.1 -uroot -phenri']
      interval: 5s
      timeout: 5s
      retries: 20

  # The adapter henri apps use for MongoDB. The test suite does not need it
  # (@usehenri/disk starts an in-process server), but an app configured with
  # `"adapter": "mongoose"` can point at this one.
  # Pinned to 7: mongo:8 refuses to start on Linux kernels 6.19 and newer,
  # which is what recent Docker Desktop VMs run (MongoDB SERVER-121912).
  mongo:
    image: mongo:7
    ports:
      - '${HENRI_MONGO_PORT:-27017}:27017'
    volumes:
      - mongo:/data/db
    healthcheck:
      test:
        ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand({ ping: 1 })"']
      interval: 5s
      timeout: 5s
      retries: 20

  # SQL Server, which is the one server `@usehenri/mssql` (and the
  # `@usehenri/sequelize` under it) can be exercised against. Developer
  # edition, which is free for development and testing; `ACCEPT_EULA` is the
  # image's own switch and is set here the way the others set a root password.
  #
  # Two things are different from the servers above. There is no arm64 image,
  # so on Apple Silicon this runs under Docker Desktop's amd64 emulation --
  # slower to start, and it wants the 2GB SQL Server asks for. And the
  # password is not `henri`: SQL Server enforces its own policy (eight
  # characters over three of upper, lower, digit and symbol) and refuses to
  # start without one, so `HENRI_TEST_MSSQL_URL` carries this one.
  #
  #   pnpm test:sql:mssql
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Henri_Passw0rd
      MSSQL_PID: Developer
    ports:
      - '${HENRI_MSSQL_PORT:-1433}:1433'
    volumes:
      - mssql:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"',
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # The shared store of `config.shared`: where the rate limit, the sign-in
  # lockout and the idempotency keys are counted when an application runs
  # more than one process. `@usehenri/redis` talks to it, and its suites run
  # against this one with HENRI_TEST_REDIS_URL (offline, they skip).
  redis:
    image: redis:8
    ports:
      - '${HENRI_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres:
  mysql:
  mariadb:
  mongo:
  mssql:
